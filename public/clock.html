<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Absensi - Padel</title>
  
  <!-- CSS Leaflet JS untuk Tampilan Maps -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    :root { 
      --green: #1b4d3e; 
      --green-dark: #14382d; 
      --gold: #d99e12; 
      --ink: #19312c; 
      --muted: #6d7e79; 
      --line: #dbe5e1; 
    }
    * { box-sizing: border-box; }
    
    /* Background disamakan dengan gradasi Form Login */
    body { 
      margin: 0; 
      min-height: 100vh; 
      padding: 24px; 
      color: var(--ink); 
      font-family: "Segoe UI", sans-serif; 
      background: linear-gradient(135deg, #1b4d3e 0%, #2c5e4a 50%, #f4b41a 100%); 
    }
    
    .shell { width: min(100%, 560px); margin: 0 auto; }
    .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 22px; }
    .brand { display: flex; align-items: center; gap: 12px; }
    .brand img { width: 44px; height: 44px; object-fit: contain; }
    .eyebrow { margin: 0 0 3px; color: #f4b41a; font-size: 11px; font-weight: 800; letter-spacing: 1.5px; text-transform: uppercase; }
    h1 { margin: 0; font-size: 24px; color: #ffffff; }
    
    .logout { 
      border: 0; 
      border-radius: 8px; 
      padding: 9px 14px; 
      color: #fff; 
      background: #c62828; 
      font-weight: 700; 
      cursor: pointer; 
      transition: background 0.2s;
    }
    .logout:hover { background: #b71c1c; }

    .card { 
      padding: 26px; 
      border-radius: 16px; 
      background: rgba(255, 255, 255, 0.96); 
      box-shadow: 0 10px 25px rgba(0,0,0,0.25); 
    }
    
    .welcome { margin-bottom: 20px; padding-bottom: 15px; border-bottom: 1px solid var(--line); }
    .welcome h2 { margin: 0 0 5px; font-size: 20px; color: var(--green); }
    .welcome p { margin: 0 0 10px; color: var(--muted); font-size: 14px; }
    .profile-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 16px 0 22px; padding: 14px; border: 1px solid var(--line); border-radius: 10px; background: #f7faf8; }
    .profile-item span { display: block; color: var(--muted); font-size: 11px; font-weight: 700; text-transform: uppercase; }
    .profile-item strong { display: block; margin-top: 3px; font-size: 13px; overflow-wrap: anywhere; }
    
    .field { margin-bottom: 16px; }
    label { display: block; margin-bottom: 6px; color: var(--muted); font-size: 12px; font-weight: 800; letter-spacing: .5px; text-transform: uppercase; }
    select { width: 100%; padding: 12px 13px; border: 1px solid var(--line); border-radius: 8px; color: var(--ink); background: #fff; font-size: 14px; outline: none; }
    select:focus { border-color: var(--gold); }

    /* Container Kamera & Maps */
    .media-box {
      position: relative;
      width: 100%;
      height: 200px;
      border-radius: 10px;
      overflow: hidden;
      border: 2px solid var(--green);
      background: #000;
      margin-bottom: 16px;
    }
    video { width: 100%; height: 100%; object-fit: cover; }
    #map { width: 100%; height: 100%; border-radius: 8px; }

    .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 20px; }
    button.action { min-height: 52px; border: 0; border-radius: 9px; color: #fff; font-size: 15px; font-weight: 800; cursor: pointer; }
    .in { background: var(--green); } 
    .in:hover { background: var(--green-dark); }
    .out { background: #b75645; }
    .out:hover { background: #a34333; }
    
    button:disabled { cursor: wait; opacity: .6; }
    .status { min-height: 22px; margin: 16px 0 0; color: var(--muted); font-size: 13px; text-align: center; }
    .status.error { color: #b33d32; font-weight: bold; } 
    .status.success { color: var(--green); font-weight: 700; }
    
    @media (max-width: 480px) { body { padding: 16px; } .card { padding: 20px; } .actions { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div class="brand">
        <img src="/logo-absen.png" alt="Padel" onerror="this.style.display='none'">
        <div>
          <p class="eyebrow">Staff Attendance</p>
          <h1>Absensi Karyawan</h1>
        </div>
      </div>
      <button class="logout" type="button" onclick="logout()">Keluar</button>
    </header>

    <section class="card">
      <div class="welcome">
        <h2 id="labelWelcome">Memuat profil...</h2>
        <p id="labelId"></p>
      </div>
      <div class="field">
        <label for="lokasi">Lokasi Kerja</label>
        <select id="lokasi" required></select>
      </div>

      <div class="field">
        <label for="shift">Shift Hari Ini</label>
        <select id="shift" required></select>
      </div>

      <!-- Live Preview Kamera Selfie -->
      <div class="field">
        <label>Foto Selfie</label>
        <div class="media-box">
          <video id="webcam" autoplay playsinline></video>
          <canvas id="canvas" style="display:none;"></canvas>
        </div>
      </div>

      <!-- Preview Titik Maps Lokasi -->
      <div class="field">
        <label>Lokasi Maps (GPS)</label>
        <div class="media-box">
          <div id="map"></div>
        </div>
      </div>

      <div class="actions">
        <button class="action in" id="btnIn" type="button" onclick="submitClock('in')">Clock In</button>
        <button class="action out" id="btnOut" type="button" onclick="submitClock('out')">Clock Out</button>
      </div>
      <p class="status" id="status" role="status"></p>
    </section>
  </main>

  <script>
    let user;
    let map, marker, userMarker;
    let videoStream;
    const lokasiSelect = document.getElementById('lokasi');
    const shiftSelect = document.getElementById('shift');
    const statusEl = document.getElementById('status');

    async function logout() { 
      matikanKamera();
      await fetch('/api/logout', { method: 'POST' }); 
      localStorage.removeItem('user_padel'); 
      window.location.href = '/login.html'; 
    }

    function setStatus(message, type = '') { 
      statusEl.textContent = message; 
      statusEl.className = `status ${type}`; 
    }

    // Fungsi Kamera Selfie
    async function initKamera() {
      try {
        videoStream = await navigator.mediaDevices.getUserMedia({ 
          video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } }, 
          audio: false 
        });
        document.getElementById('webcam').srcObject = videoStream;
      } catch (err) {
        setStatus('Kamera tidak dapat diakses. Mohon beri izin akses kamera!', 'error');
      }
    }

    function matikanKamera() {
      if (videoStream) {
        videoStream.getTracks().forEach(track => track.stop());
      }
    }

    function ambilFotoBase64() {
      const video = document.getElementById('webcam');
      const canvas = document.getElementById('canvas');
      canvas.width = video.videoWidth || 320;
      canvas.height = video.videoHeight || 240;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      return canvas.toDataURL('image/jpeg', 0.6);
    }

    // Inisialisasi Peta Leaflet
    function initMap() {
      map = L.map('map').setView([-6.9181, 107.5842], 15);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap'
      }).addTo(map);

      // Dapatkan posisi GPS Karyawan saat ini
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition((pos) => {
          const lat = pos.coords.latitude;
          const lng = pos.coords.longitude;
          
          userMarker = L.marker([lat, lng]).addTo(map)
            .bindPopup("Posisi Anda Saat Ini").openPopup();
          
          map.setView([lat, lng], 16);
        });
      }
    }

    function updateShifts() {
      const locations = window.locations || {};
      const selectedCode = lokasiSelect.value;
      const selected = locations[selectedCode];
      
      shiftSelect.innerHTML = '';
      (selected ? selected.shifts : []).forEach(shift => {
        const option = document.createElement('option'); 
        option.value = shift; 
        option.textContent = shift; 
        shiftSelect.appendChild(option);
      });

      // Update marker lokasi di peta sesuai lokasi yang dipilih
      if (selected && selected.lat && selected.lng) {
        if (marker) map.removeLayer(marker);
        marker = L.circle([selected.lat, selected.lng], {
          color: '#1b4d3e',
          fillColor: '#d99e12',
          fillOpacity: 0.4,
          radius: selected.radius_meter || 50
        }).addTo(map);
        
        map.panTo([selected.lat, selected.lng]);
      }
    }

    lokasiSelect.addEventListener('change', updateShifts);

    async function submitClock(type) {
      const buttons = document.querySelectorAll('button.action'); 
      buttons.forEach(button => button.disabled = true); 
      setStatus(type === 'in' ? 'Memeriksa lokasi & mengambil foto...' : 'Mengirim clock out...');
      
      try {
        const fotoSelfie = ambilFotoBase64();
        const payload = { 
          id_karyawan: user.id_karyawan, 
          foto: fotoSelfie 
        };

        if (type === 'in') {
          const position = await new Promise((resolve, reject) => 
            navigator.geolocation.getCurrentPosition(resolve, reject, { enableHighAccuracy: true, timeout: 10000 })
          );
          
          payload.kode_lokasi = lokasiSelect.value; 
          payload.shift = shiftSelect.value; 
          payload.user_lat = position.coords.latitude; 
          payload.user_lng = position.coords.longitude;
        }

        const response = await fetch(`/api/clock-${type === 'in' ? 'in' : 'out'}`, { 
          method: 'POST', 
          headers: { 'Content-Type': 'application/json' }, 
          body: JSON.stringify(payload) 
        });

        const result = await response.json();
        if (!response.ok) throw new Error(result.error || 'Presensi gagal.');
        
        setStatus(result.message, 'success');
      } catch (error) { 
        setStatus(error.message || 'Presensi gagal diproses.', 'error'); 
      } finally { 
        buttons.forEach(button => button.disabled = false); 
      }
    }

    async function init() {
      const response = await fetch('/api/session');
      if (!response.ok) { 
        localStorage.removeItem('user_padel'); 
        window.location.href = '/login.html'; 
        return; 
      }
      
      const session = await response.json();
      user = session.user;
      
      if (user.role === 'admin') { 
        window.location.href = '/admin.html'; 
        return; 
      }

      const profileResponse = await fetch('/api/profile');
      if (!profileResponse.ok) throw new Error('Profil karyawan tidak ditemukan.');
      const { profile } = await profileResponse.json();
      user = profile;

      document.getElementById('labelWelcome').textContent = `Halo, ${user.nama}`;
      document.getElementById('labelId').textContent = `ID Karyawan: ${user.id_karyawan}`;
      document.getElementById('profileNama').textContent = user.nama || '-';
      document.getElementById('profileId').textContent = user.id_karyawan || '-';
      document.getElementById('profilePhone').textContent = user.no_hp || '-';
      document.getElementById('profileJoin').textContent = user.tgl_join ? new Date(user.tgl_join).toLocaleDateString('id-ID') : '-';

      // Inisialisasi Peta & Kamera
      initMap();
      initKamera();

      const locationResponse = await fetch('/api/lokasi'); 
      window.locations = await locationResponse.json();
      
      Object.entries(window.locations).forEach(([code, location]) => { 
        const option = document.createElement('option'); 
        option.value = code; 
        option.textContent = location.nama; 
        lokasiSelect.appendChild(option); 
      });
      
      updateShifts();
    }

    init().catch(error => setStatus(error.message, 'error'));
  </script>
</body>
</html>
