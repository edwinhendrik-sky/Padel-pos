<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistem Management - Padel CV BUS</title>
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- CSS & JS Leaflet untuk Maps -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    // PROTEKSI SESI LOGIN KARYAWAN
    let currentKaryawan = null;
    const savedKaryawan = localStorage.getItem('karyawan_aktif');
    if (!savedKaryawan || savedKaryawan === 'null' || savedKaryawan === 'undefined') {
      window.location.replace('/login.html');
    } else {
      try {
        currentKaryawan = JSON.parse(savedKaryawan);
        if (!currentKaryawan || !currentKaryawan.id_karyawan) {
          window.location.replace('/login.html');
        }
      } catch (e) {
        localStorage.removeItem('karyawan_aktif');
        window.location.replace('/login.html');
      }
    }
  </script>
</head>
<body class="bg-gradient-to-br from-[#1b4d3e] via-[#2c5e4a] to-[#d99e12] min-h-screen flex items-center justify-center p-4 font-sans text-slate-800">

  <div class="w-full max-w-lg bg-white/95 backdrop-blur-md rounded-2xl shadow-2xl overflow-hidden border border-amber-200/40 my-4">
    
    <!-- HEADER BRANDING HIJAU & EMAS -->
    <div class="bg-[#1b4d3e] p-5 text-white flex justify-between items-center border-b-4 border-[#d99e12]">
      <div>
        <span class="text-[10px] font-bold tracking-widest text-[#f4b41a] uppercase block">STAFF ATTENDANCE</span>
        <h1 class="text-xl font-black text-white tracking-tight">Absensi Karyawan</h1>
        <p class="text-[11px] text-emerald-100/80">Padel Del Luna & Padel Boss Mengger</p>
      </div>
      <button onclick="logoutKaryawan()" class="bg-rose-600 hover:bg-rose-700 text-white text-xs px-3.5 py-2 rounded-lg font-bold transition shadow">
        Keluar
      </button>
    </div>

    <div class="p-5 space-y-4">
      
      <!-- CARD SAPAAN KARYAWAN -->
      <div class="bg-slate-50 border border-slate-200 p-3.5 rounded-xl flex justify-between items-center">
        <div>
          <h2 class="text-base font-bold text-[#1b4d3e]" id="info-karyawan-nama">Halo, Karyawan</h2>
          <p class="text-xs text-slate-500 font-medium">ID Karyawan: <span id="info-karyawan-id" class="text-[#d99e12] font-bold">PDL-000</span></p>
        </div>
        <div class="w-10 h-10 rounded-full bg-[#1b4d3e] text-[#f4b41a] font-bold flex items-center justify-center text-sm shadow-sm border-2 border-[#d99e12]" id="info-avatar">
          P
        </div>
      </div>

      <!-- FORM LOKASI & SHIFT -->
      <div class="space-y-3">
        <div>
          <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">LOKASI KERJA</label>
          <select id="select-lokasi" onchange="updateShiftOptions()" class="w-full border border-slate-300 p-2.5 rounded-lg text-sm bg-white font-medium focus:ring-2 focus:ring-[#f4b41a] focus:border-[#1b4d3e] outline-none">
            <option value="del_luna">Padel Del Luna</option>
            <option value="boss_mengger">Padel Boss Mengger</option>
          </select>
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">SHIFT HARI INI</label>
          <select id="select-shift" class="w-full border border-slate-300 p-2.5 rounded-lg text-sm bg-white font-medium focus:ring-2 focus:ring-[#f4b41a] focus:border-[#1b4d3e] outline-none">
          </select>
        </div>
      </div>

      <!-- TAMPILAN KAMERA SELFIE & MAPS BERDAMPINGAN (2 KOLOM) -->
      <div class="grid grid-cols-2 gap-3 pt-1">
        
        <!-- KOLOM KIRI: KAMERA SELFIE -->
        <div class="space-y-1">
          <label class="block text-[11px] font-bold text-slate-700 uppercase tracking-wider">FOTO SELFIE</label>
          <div class="relative bg-slate-900 rounded-xl overflow-hidden h-36 border-2 border-[#1b4d3e] shadow-inner flex items-center justify-center">
            <video id="webcam" autoplay playsinline class="w-full h-full object-cover"></video>
            <canvas id="canvas" class="hidden"></canvas>
            <div class="absolute bottom-1 left-1 right-1 bg-black/60 backdrop-blur-sm text-white text-[9px] py-0.5 px-1 rounded text-center font-medium">
              Kamera Active
            </div>
          </div>
        </div>

        <!-- KOLOM KANAN: MAPS GPS -->
        <div class="space-y-1">
          <div class="flex justify-between items-center text-[11px]">
            <label class="font-bold text-slate-700 uppercase tracking-wider">LOKASI (GPS)</label>
            <span id="gps-status" class="text-[9px] font-semibold text-emerald-600 flex items-center gap-0.5">
              <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span> Aktif
            </span>
          </div>
          <div class="h-36 rounded-xl overflow-hidden border-2 border-[#1b4d3e] shadow-inner z-10" id="map"></div>
        </div>

      </div>

      <!-- TOMBOL CLOCK IN & CLOCK OUT -->
      <div class="grid grid-cols-2 gap-3 pt-2">
        <button onclick="eksekusiAbsen('in')" class="bg-[#1b4d3e] hover:bg-[#14382d] text-white py-3 px-4 rounded-xl font-bold text-sm shadow-md hover:shadow-lg transition flex justify-center items-center gap-1 border-b-2 border-emerald-900">
          📍 Clock In
        </button>
        <button onclick="eksekusiAbsen('out')" class="bg-[#b71c1c] hover:bg-[#9a1717] text-white py-3 px-4 rounded-xl font-bold text-sm shadow-md hover:shadow-lg transition flex justify-center items-center gap-1 border-b-2 border-rose-900">
          🏁 Clock Out
        </button>
      </div>

      <!-- SECTION HISTORY ABSEN KARYAWAN -->
      <div class="pt-3 border-t border-slate-200 space-y-2">
        <div class="flex justify-between items-center">
          <h3 class="text-xs font-bold text-[#1b4d3e] uppercase tracking-wider flex items-center gap-1">
            <span>📅 Histori Presensi Saya</span>
          </h3>
          <button onclick="loadHistoryKaryawan()" class="text-[10px] bg-slate-100 hover:bg-slate-200 text-slate-700 px-2 py-1 rounded font-bold transition">
            🔄 Refresh
          </button>
        </div>

        <div class="bg-slate-50 rounded-xl border border-slate-200 overflow-hidden max-h-40 overflow-y-auto">
          <table class="w-full text-left text-[11px]">
            <thead class="bg-slate-200 text-slate-700 font-bold sticky top-0">
              <tr>
                <th class="p-2">Tanggal</th>
                <th class="p-2">In</th>
                <th class="p-2">Out</th>
                <th class="p-2">Status</th>
              </tr>
            </thead>
            <tbody id="tb-history-karyawan" class="divide-y divide-slate-200">
              <tr><td colspan="4" class="p-3 text-center text-slate-400">Memuat riwayat...</td></tr>
            </tbody>
          </table>
        </div>
      </div>

    </div>
  </div>

  <script>
    let masterLokasi = {};
    let videoStream = null;
    let map, marker, userMarker;

    function initMap() {
      map = L.map('map').setView([-6.9181, 107.5842], 15);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition((pos) => {
          const lat = pos.coords.latitude;
          const lng = pos.coords.longitude;
          userMarker = L.marker([lat, lng]).addTo(map).bindPopup("Posisi Anda").openPopup();
          map.setView([lat, lng], 16);
        });
      }
    }

    async function loadLokasi() {
      try {
        const res = await fetch('/api/lokasi');
        masterLokasi = await res.json();
        updateShiftOptions();
      } catch (err) {
        console.error("Gagal muat lokasi:", err);
      }
    }

    function updateShiftOptions() {
      const kode = document.getElementById('select-lokasi').value;
      const selectShift = document.getElementById('select-shift');
      selectShift.innerHTML = '';

      if (masterLokasi[kode] && masterLokasi[kode].shifts) {
        masterLokasi[kode].shifts.forEach(s => {
          const opt = document.createElement('option');
          opt.value = s;
          opt.innerText = s;
          selectShift.appendChild(opt);
        });

        const selected = masterLokasi[kode];
        if (selected && selected.lat && selected.lng && map) {
          if (marker) map.removeLayer(marker);
          marker = L.circle([selected.lat, selected.lng], {
            color: '#1b4d3e', fillColor: '#d99e12', fillOpacity: 0.4, radius: selected.radius_meter || 50
          }).addTo(map);
          map.panTo([selected.lat, selected.lng]);
        }
      }
    }

    async function mulaikamera() {
      try {
        videoStream = await navigator.mediaDevices.getUserMedia({ 
          video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } }, 
          audio: false 
        });
        document.getElementById('webcam').srcObject = videoStream;
      } catch (err) {
        alert("Gagal membuka kamera: Mohon berikan izin akses kamera di browser HP Anda!");
      }
    }

    function matikanKamera() {
      if (videoStream) {
        videoStream.getTracks().forEach(track => track.stop());
      }
    }

    function ambilFotoBase64() {
      const video = document.getElementById('webcam');
      const canvas = document.getElementById('canvas');
      canvas.width = video.videoWidth || 320;
      canvas.height = video.videoHeight || 240;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      return canvas.toDataURL('image/jpeg', 0.6);
    }

    async function eksekusiAbsen(tipe) {
      if (!currentKaryawan || !currentKaryawan.id_karyawan) {
        alert("Sesi presensi berakhir. Silakan login kembali!");
        return logoutKaryawan();
      }

      const fotoBase64 = ambilFotoBase64();
      if (!fotoBase64 || fotoBase64.length < 100) {
        return alert("Kamera belum siap. Pastikan wajah Anda terlihat di layar kamera!");
      }

      const kodeLokasi = document.getElementById('select-lokasi').value;
      const shift = document.getElementById('select-shift').value;

      if (!navigator.geolocation) {
        return alert("Browser/HP Anda tidak mendukung fitur lokasi GPS.");
      }

      navigator.geolocation.getCurrentPosition(
        async (pos) => {
          const payload = {
            id_karyawan: currentKaryawan.id_karyawan,
            kode_lokasi: kodeLokasi,
            shift: shift,
            user_lat: pos.coords.latitude,
            user_lng: pos.coords.longitude,
            foto: fotoBase64
          };

          const endpoint = (tipe === 'in') ? '/api/clock-in' : '/api/clock-out';

          try {
            const res = await fetch(endpoint, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(payload)
            });

            const result = await res.json();
            if (!res.ok) throw new Error(result.error || "Gagal Presensi!");

            alert("✅ " + result.message);
            loadHistoryKaryawan();
          } catch (err) {
            alert("❌ " + err.message);
          }
        },
        (err) => {
          alert("Error GPS: Mohon aktifkan GPS Lokasi pada HP Anda untuk melakukan presensi!");
        },
        { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
      );
    }

    async function loadHistoryKaryawan() {
      const tbody = document.getElementById('tb-history-karyawan');
      try {
        const res = await fetch('/api/riwayat');
        if (!res.ok) throw new Error('Gagal memuat histori');
        const data = await res.json();

        const myHistory = data.filter(d => 
          d.id_karyawan === currentKaryawan.id_karyawan || d.nama === currentKaryawan.nama
        );

        if (myHistory.length === 0) {
          tbody.innerHTML = `<tr><td colspan="4" class="p-3 text-center text-slate-400">Belum ada catatan presensi.</td></tr>`;
          return;
        }

        tbody.innerHTML = myHistory.slice(0, 10).map(r => {
          const tgl = r.tanggal ? new Date(r.tanggal).toLocaleDateString('id-ID', { day: '2-digit', month: '2-digit' }) : '-';
          const cIn = r.clock_in ? new Date(r.clock_in).toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' }) : '-';
          const cOut = r.clock_out ? new Date(r.clock_out).toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' }) : '-';
          const isValid = r.clock_in && r.clock_out;

          return `
            <tr class="hover:bg-slate-100">
              <td class="p-2 font-medium text-slate-800">${tgl}</td>
              <td class="p-2 text-emerald-700 font-bold">${cIn}</td>
              <td class="p-2 text-rose-700 font-bold">${cOut}</td>
              <td class="p-2">
                ${isValid 
                  ? `<span class="bg-emerald-100 text-emerald-800 text-[9px] font-bold px-1.5 py-0.5 rounded">Sah</span>` 
                  : `<span class="bg-amber-100 text-amber-800 text-[9px] font-bold px-1.5 py-0.5 rounded">Aktif</span>`}
              </td>
            </tr>
          `;
        }).join('');
      } catch (err) {
        tbody.innerHTML = `<tr><td colspan="4" class="p-3 text-center text-rose-500">Gagal memuat riwayat.</td></tr>`;
      }
    }

    function logoutKaryawan() {
      matikanKamera();
      localStorage.removeItem('karyawan_aktif');
      window.location.replace('/login.html');
    }

    window.addEventListener('DOMContentLoaded', () => {
      if (currentKaryawan) {
        document.getElementById('info-karyawan-nama').innerText = `Halo, ${currentKaryawan.nama}`;
        document.getElementById('info-karyawan-id').innerText = currentKaryawan.id_karyawan;
        document.getElementById('info-avatar').innerText = currentKaryawan.nama ? currentKaryawan.nama.charAt(0).toUpperCase() : 'P';
      }
      initMap();
      loadLokasi();
      mulaikamera();
      loadHistoryKaryawan();
    });
  </script>
</body>
</html>
