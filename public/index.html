<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Padel Club POS & Absensi</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 p-8 font-sans">
    <div class="max-w-4xl mx-auto space-y-8">
        
        <!-- HEADER UTAMA -->
        <div class="flex justify-between items-center bg-slate-900 text-white p-6 rounded-xl shadow-lg">
            <div>
                <h1 class="text-2xl font-bold">Padel Club Operations</h1>
                <p class="text-sm text-slate-400" id="userStatusText">Mode: Absensi Karyawan</p>
            </div>
            <!-- Tombol Switch Mode Admin (Akan Muncul Setelah Login) -->
            <button id="btnLogout" onclick="logoutAdmin()" class="hidden bg-rose-600 hover:bg-rose-700 text-white px-4 py-2 rounded text-sm font-semibold">
                Exit Admin Mode
            </button>
        </div>

        <!-- 1. TAMPILAN AWAL: PRESENSI KARYAWAN ONLY -->
        <div id="sectionKaryawan" class="bg-white p-6 rounded-xl shadow-md border border-slate-200">
            <h2 class="text-xl font-bold mb-4 text-emerald-600">Presensi Karyawan</h2>
            
            <div class="mb-6 flex gap-2">
                <input id="namaKaryawan" type="text" placeholder="Nama Karyawan" class="border p-2 rounded w-full">
                <input id="jabatanKaryawan" type="text" placeholder="Jabatan" class="border p-2 rounded w-full">
                <button onclick="tambahKaryawan()" class="bg-emerald-600 text-white px-4 py-2 rounded font-semibold hover:bg-emerald-700">Tambah</button>
            </div>

            <h3 class="font-semibold text-slate-700 mb-2">Presensi Hari Ini</h3>
            <div id="listKaryawan" class="space-y-2"></div>

            <!-- PIN Trigger Akses Admin -->
            <div class="mt-8 pt-6 border-t border-slate-100 flex justify-end">
                <button onclick="bukaModalLogin()" class="text-xs text-slate-400 hover:text-slate-600 underline">
                    Akses Fitur Management / Launching Mode
                </button>
            </div>
        </div>

        <!-- 2. SECTION MEMBERSHIP (DI-HIDE LEBIH DULU) -->
        <div id="sectionMembership" class="hidden bg-white p-6 rounded-xl shadow-md border border-slate-200">
            <h2 class="text-xl font-bold mb-4 text-blue-600">Membership Padel (Admin Mode)</h2>
            
            <div class="space-y-3 mb-6">
                <input id="namaMember" type="text" placeholder="Nama Member" class="border p-2 rounded w-full">
                <input id="teleponMember" type="text" placeholder="No. WhatsApp" class="border p-2 rounded w-full">
                <select id="paketMember" class="border p-2 rounded w-full">
                    <option value="Monthly (1 Bulan)">Monthly (1 Bulan)</option>
                    <option value="6 Months Package">6 Months Package</option>
                    <option value="VIP Annual">VIP Annual</option>
                </select>
                <button onclick="tambahMember()" class="bg-blue-600 text-white w-full py-2 rounded font-semibold hover:bg-blue-700">Daftarkan Member</button>
            </div>

            <h3 class="font-semibold text-slate-700 mb-2">Daftar Member Aktif</h3>
            <div id="listMember" class="space-y-2"></div>
        </div>

    </div>

    <!-- MODAL POPUP LOGIN PIN ADMIN -->
    <div id="modalLogin" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center p-4">
        <div class="bg-white p-6 rounded-xl w-full max-w-sm space-y-4">
            <h3 class="font-bold text-lg text-slate-800">Verifikasi Admin</h3>
            <p class="text-xs text-slate-500">Masukkan PIN khusus untuk membuka akses Membership & Management.</p>
            <input id="pinInput" type="password" placeholder="Masukkan PIN (Default: 1234)" class="border p-2 rounded w-full text-center text-lg tracking-widest">
            <div class="flex gap-2">
                <button onclick="tutupModalLogin()" class="w-1/2 bg-slate-200 text-slate-700 py-2 rounded font-semibold">Batal</button>
                <button onclick="verifikasiPin()" class="w-1/2 bg-blue-600 text-white py-2 rounded font-semibold hover:bg-blue-700">Masuk</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
