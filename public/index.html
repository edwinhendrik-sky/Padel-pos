<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Padel Club Operations & Absensi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .modal-backdrop { display: none; }
        .modal-backdrop.open { display: flex; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans">

    <!-- CONTAINER UTAMA -->
    <div id="mobileView" class="max-w-md mx-auto p-4 space-y-6">
        
        <!-- HEADER -->
        <div class="bg-slate-800 p-6 rounded-2xl shadow-xl border border-slate-700 text-center">
            <h1 class="text-2xl font-bold text-emerald-400">Padel Club Presensi</h1>
            <p id="mobileDate" class="text-xs text-slate-400 mt-1">Memuat tanggal...</p>
        </div>

        <!-- FORM LOGIN KARYAWAN -->
        <div id="mobileLogin" class="bg-slate-800 p-6 rounded-2xl border border-slate-700 shadow-xl space-y-4">
            <h2 class="text-lg font-semibold text-slate-200">Login Karyawan</h2>
            <form id="mobileLoginForm" class="space-y-3">
                <div>
                    <label class="text-xs text-slate-400">ID Karyawan</label>
                    <input name="employeeId" id="inputEmployeeId" type="text" placeholder="Contoh: PDL-0001" required class="w-full bg-slate-900 border border-slate-700 p-3 rounded-xl text-white mt-1 uppercase">
                </div>
                <div>
                    <label class="text-xs text-slate-400">PIN</label>
                    <input name="pin" id="inputPin" type="password" inputmode="numeric" placeholder="****" required class="w-full bg-slate-900 border border-slate-700 p-3 rounded-xl text-white mt-1 tracking-widest text-center">
                </div>
                <p id="mobileLoginMessage" class="text-xs text-rose-400 font-semibold mt-1"></p>
                <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white py-3 rounded-xl font-bold shadow-lg shadow-emerald-900/40">Masuk Aplikasi</button>
            </form>
        </div>

        <!-- CARD CLOCK IN / OUT (Sembunyi secara default) -->
        <div id="mobileDashboard" class="hidden bg-slate-800 p-6 rounded-2xl border border-slate-700 shadow-xl space-y-4">
            <div class="flex justify-between items-center pb-4 border-b border-slate-700">
                <div>
                    <h3 id="mobileEmployeeName" class="text-xl font-bold text-white">Halo!</h3>
                    <p id="mobileAttendanceStatus" class="text-xs text-emerald-400">Status Presensi</p>
                </div>
                <button id="mobileLogout" type="button" class="text-xs bg-slate-700 hover:bg-slate-600 px-3 py-1.5 rounded-lg text-slate-300">Keluar</button>
            </div>

            <div class="text-center py-2">
                <p id="mobileAttendanceTime" class="text-2xl font-mono font-bold text-slate-200">--:--</p>
                <p id="mobileLocationInfo" class="text-[10px] text-slate-400 mt-1">Memeriksa GPS...</p>
            </div>

            <!-- OPSI MASUK PENGGANTI -->
            <label class="flex items-center gap-2 text-xs text-slate-300 bg-slate-900/50 p-3 rounded-xl border border-slate-700/50 cursor-pointer">
                <input type="checkbox" id="mobileReplacement" class="rounded accent-emerald-500">
                <span>Masuk sebagai pengganti (Hari Libur)</span>
            </label>

            <!-- TOMBOL CLOCK IN & OUT -->
            <div class="grid grid-cols-2 gap-3 pt-2">
                <button id="mobileClockIn" data-clock="in" class="bg-emerald-600 hover:bg-emerald-500 text-white py-3 rounded-xl font-bold disabled:opacity-40 disabled:cursor-not-allowed">
                    Clock In
                </button>
                <button id="mobileClockOut" data-clock="out" class="bg-rose-600 hover:bg-rose-500 text-white py-3 rounded-xl font-bold disabled:opacity-40 disabled:cursor-not-allowed">
                    Clock Out
                </button>
            </div>
        </div>

        <!-- REKAPITULASI -->
        <div id="mobileReportCard" class="hidden bg-slate-800 p-4 rounded-2xl border border-slate-700 space-y-2">
            <h4 class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Rekapitulasi Bulan Ini</h4>
            <div id="mobileReportSummary" class="flex justify-between text-xs text-slate-300 pt-1">
                <span>Hadir <b>0</b></span>
                <span>Izin <b>0</b></span>
                <span>Absen <b>0</b></span>
            </div>
        </div>

    </div>

    <!-- MODAL SELFIE -->
    <div id="clockModal" class="modal-backdrop fixed inset-0 bg-black/80 items-center justify-center p-4 z-50">
        <div class="bg-slate-800 p-6 rounded-2xl max-w-sm w-full border border-slate-700 space-y-4">
            <h3 id="clockTitle" class="text-lg font-bold text-white">Clock In</h3>
            <p id="clockDescription" class="text-xs text-slate-400"></p>
            
            <form id="clockForm" class="space-y-4">
                <input type="hidden" name="employeeId">
                <input type="checkbox" name="replacement" class="hidden">
                
                <div class="space-y-2">
                    <label class="block text-xs text-slate-300">Ambil Foto Selfie Presensi</label>
                    <input id="selfieInput" type="file" accept="image/*" capture="user" required class="block w-full text-xs text-slate-400 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-emerald-600 file:text-white hover:file:bg-emerald-500">
                    <img id="selfiePreview" class="hidden w-full h-48 object-cover rounded-xl border border-slate-700">
                </div>

                <p id="clockLocationMessage" class="text-xs text-amber-400 font-medium"></p>

                <div class="flex gap-2">
                    <button type="button" data-close-modal class="w-1/2 bg-slate-700 text-slate-300 py-2.5 rounded-xl text-sm font-semibold">Batal</button>
                    <button type="submit" class="w-1/2 bg-emerald-600 hover:bg-emerald-500 text-white py-2.5 rounded-xl text-sm font-bold">Kirim Presensi</button>
                </div>
            </form>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
