<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Absensi - Padel</title>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { 
      background: linear-gradient(135deg, #1b4d3e 0%, #2c5e4a 50%, #f4b41a 100%);
      display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; 
    }
    .login-card { 
      background: rgba(255, 255, 255, 0.95); 
      padding: 40px 35px; 
      border-radius: 16px; 
      box-shadow: 0 10px 25px rgba(0,0,0,0.2); 
      width: 100%; 
      max-width: 400px; 
      text-align: center;
    }
    
    .brand-header { margin-bottom: 25px; }
    .brand-header h1 { margin: 0; color: #1b4d3e; font-size: 22px; font-weight: 800; letter-spacing: -0.5px; }
    .brand-header p { margin: 4px 0 0 0; color: #d99e12; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; }

    h2 { margin-top: 0; color: #1a252f; font-size: 18px; font-weight: 700; }
    .subtitle { color: #6c757d; font-size: 13px; margin-bottom: 25px; }
    .form-group { margin-bottom: 18px; text-align: left; }
    label { display: block; font-weight: 600; margin-bottom: 6px; font-size: 13px; color: #495057; }
    input { width: 100%; padding: 12px; border: 1px solid #ced4da; border-radius: 8px; font-size: 14px; }
    input:focus { border-color: #f4b41a; outline: none; box-shadow: 0 0 5px rgba(244, 180, 26, 0.3); }
    button { 
      width: 100%; padding: 12px; 
      background-color: #1b4d3e; color: white; 
      border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 15px; 
      transition: background 0.2s;
    }
    button:hover { background-color: #14382d; }
  </style>
</head>
<body>

<div class="login-card">
  <div class="brand-header">
    <h1>Management Padel</h1>
    <p>Sudirman & Mengger Bandung</p>
  </div>
  
  <h2>Portal Absensi & HR</h2>
  <div class="subtitle">Silakan masukkan ID Karyawan atau No. HP</div>
  
  <form id="formLogin">
    <div class="form-group">
      <label for="idKaryawan">ID Karyawan / No. HP:</label>
      <input type="text" id="idKaryawan" placeholder="Contoh: PDL-001" required autocomplete="off">
    </div>
    <button type="submit">MASUK KE SISTEM</button>
  </form>
</div>

<script>
  window.onload = () => {
    const userSession = localStorage.getItem('user_padel');
    if (userSession) {
      const user = JSON.parse(userSession);
      if (user.role === 'admin') window.location.href = '/admin.html';
      else window.location.href = '/';
    }
  };

  document.getElementById('formLogin').addEventListener('submit', async (e) => {
    e.preventDefault();
    const idInput = document.getElementById('idKaryawan').value.trim();

    try {
      const res = await fetch('/api/karyawan');
      const data = await res.json();
      const user = data.find(k => k.id_karyawan.toLowerCase() === idInput.toLowerCase() || k.no_hp === idInput);

      if (user) {
        const role = user.id_karyawan.toUpperCase().includes('ADMIN') ? 'admin' : 'karyawan';
        localStorage.clear();
        localStorage.setItem('user_padel', JSON.stringify({ id_karyawan: user.id_karyawan, nama: user.nama, role }));
        window.location.href = role === 'admin' ? '/admin.html' : '/';
      } else {
        alert('Data Karyawan tidak ditemukan!');
      }
    } catch (err) { alert('Gagal menghubungkan ke server!'); }
  });
</script>

</body>
</html>
